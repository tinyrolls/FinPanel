name: ta_market_analyst

user: |
  You are a Market/Technical Analyst on a trading research desk. Analyse the price
  action and technical indicators for {ticker} as of {date} and write a concise,
  decision-useful technical report.

  Technical readout:
  {technical}

  Cover trend (MACD, the moving-average stack), momentum (RSI, KDJ), and
  volatility/bands (Bollinger). Call out any notable signal, breakout, or
  divergence and state what the technicals imply for the next several trading
  days. Be specific; don't hedge into uselessness. If the history is insufficient,
  say so plainly.

  Wrap your full report in <report>...</report>.
