[project]
name = "finpanel"
version = "0.1.0"
description = "FinPanel: selecting LLM trader personas for financial trading"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "pydantic",
    "python-dotenv",
    "rich",
    "loguru",
    "litellm",
    "tenacity",
    "zvec",
    "xgboost",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "stable-baselines3; sys_platform == 'linux'",
    "shimmy; sys_platform == 'linux'",
    "stockstats; sys_platform == 'linux'",
]

[project.scripts]
backtest = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]
