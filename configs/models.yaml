defaults:
  temperature: 0
  timeout_s: 90
  max_retries: 2
  seed: 42

models:
  gpt-4o-mini-2024-07-18:
    provider: openai
    display_name: "[openai] gpt-4o-mini (pinned 2024-07-18)"
  gpt-4o:
    provider: openai
    display_name: "[openai] gpt-4o"
  o1:
    provider: openai
    display_name: "[openai] o1"
  o3-mini:
    provider: openai
    display_name: "[openai] o3-mini"

  claude-3-haiku-20240307:
    provider: anthropic
    display_name: "[anthropic] claude-3-haiku"
  claude-3-sonnet-20240229:
    provider: anthropic
    display_name: "[anthropic] claude-3-sonnet"

  deepseek-v4-flash:
    provider: deepseek
    display_name: "[deepseek] deepseek-v4-flash"
    extra_body:
      thinking:
        type: disabled

  gpt-oss-120b:
    provider: openai_compatible
    base_url: http://127.0.0.1:30000/v1
    api_key_env: LOCAL_API_KEY
    display_name: "[local] gpt-oss-120b (sglang)"
    timeout_s: 1800
    max_tokens: 16384
    sim_date_template: true

  Qwen3-30B-A3B:
    provider: openai_compatible
    base_url: http://127.0.0.1:30000/v1
    api_key_env: LOCAL_API_KEY
    display_name: "[local] Qwen3-30B-A3B (sglang, non-thinking)"
    timeout_s: 600
    max_tokens: 16384
    temperature: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  Llama-3.3-70B-Instruct:
    provider: openai_compatible
    base_url: http://127.0.0.1:30000/v1
    api_key_env: LOCAL_API_KEY
    display_name: "[local] Llama-3.3-70B-Instruct (sglang)"
    timeout_s: 600
    max_tokens: 16384
